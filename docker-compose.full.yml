services:
  app:
    build: .
    container_name: database-demo-app
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - postgres
      - redis
      - mongodb
      - milvus
    networks:
      - database-net

  mysql:
    image: mysql:8.4
    container_name: visual-lab-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: visual_lab
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - database-net

  postgres:
    image: postgres:16
    container_name: visual-lab-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: visual_lab
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - database-net

  redis:
    image: redis:7.2
    container_name: visual-lab-redis
    ports:
      - "6379:6379"
    networks:
      - database-net

  mongodb:
    image: mongo:7.0
    container_name: visual-lab-mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - database-net

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: visual-lab-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command:
      - etcd
      - -advertise-client-urls=http://127.0.0.1:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - -data-dir=/etcd
    volumes:
      - milvus-etcd:/etcd
    networks:
      - database-net

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: visual-lab-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - milvus-minio:/minio_data
    networks:
      - database-net

  milvus:
    image: milvusdb/milvus:v2.5.6
    container_name: visual-lab-milvus
    command:
      - milvus
      - run
      - standalone
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    networks:
      - database-net

networks:
  database-net:
    driver: bridge

volumes:
  milvus-etcd:
  milvus-minio:
  milvus-data:
